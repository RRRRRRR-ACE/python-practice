<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能系统运维 - Python代码练习</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f5f6fa; color:#2d3436; display:flex; height:100vh; overflow:hidden; }
.sidebar { width:280px; background:#2d3436; color:#fff; padding:20px 0; overflow-y:auto; flex-shrink:0; }
.sidebar h2 { padding:0 20px 15px; font-size:16px; border-bottom:1px solid #636e72; margin-bottom:10px; }
.nb-item { padding:12px 20px; cursor:pointer; transition:background .2s; border-left:3px solid transparent; }
.nb-item:hover { background:#636e72; }
.nb-item.active { background:#0984e3; border-left-color:#74b9ff; }
.nb-item .nb-id { font-size:12px; opacity:.7; }
.nb-item .nb-title { font-size:14px; margin-top:2px; }
.main { flex:1; overflow-y:auto; padding:30px; }
.nb-header { margin-bottom:20px; }
.nb-header h1 { font-size:24px; color:#2d3436; }
.nb-header p { color:#636e72; margin-top:5px; }
.toolbar { margin:15px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.toolbar button { padding:8px 18px; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
.btn-check { background:#00b894; color:#fff; }
.btn-check:hover { background:#00a381; }
.btn-reveal { background:#fdcb6e; color:#2d3436; }
.btn-reset { background:#dfe6e9; color:#2d3436; }
.score-box { font-size:18px; font-weight:700; margin-left:15px; }
.cell { background:#fff; border-radius:8px; margin-bottom:15px; box-shadow:0 1px 3px rgba(0,0,0,.1); overflow:hidden; }
.cell-label { background:#dfe6e9; padding:6px 15px; font-size:12px; color:#636e72; font-family:monospace; }
pre.code { padding:15px; font-family:"Consolas","Monaco",monospace; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:break-all; }
.blank { display:inline-block; min-width:120px; padding:2px 8px; border:2px solid #74b9ff; border-radius:4px; background:#e3f2fd; font-family:inherit; font-size:inherit; outline:none; color:#0984e3; font-weight:600; }
.blank:focus { border-color:#0984e3; }
.blank.correct { background:#c6f6d5; border-color:#00b894; color:#00695c; }
.blank.wrong { background:#fed7d7; border-color:#e17055; color:#c0392b; }
.blank.revealed { background:#fefcbf; border-color:#f6e05e; color:#975a16; }
.ans-hint { display:none; font-size:12px; color:#e17055; margin-left:8px; font-weight:normal; }
.ans-hint.show { display:inline; }
.cell-result { padding:8px 15px; font-size:13px; display:none; }
.cell-result.show { display:block; }
.pass { background:#c6f6d5; color:#00695c; }
.fail { background:#fed7d7; color:#c0392b; }

/* ===== 手机竖屏适配 ===== */
@media (max-width: 768px){
  body { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
  .sidebar {
    width: 100%; height: auto; max-height: 116px;
    padding: 8px 0; overflow-x: auto; overflow-y: hidden;
    border-bottom: 1px solid #4a5052;
  }
  .sidebar h2 { display: none; }
  #nbList { display: flex; flex-direction: row; gap: 6px; padding: 0 10px; }
  .nb-item {
    flex: 0 0 auto; min-width: 128px; padding: 8px 12px;
    border-left: none; border-bottom: 3px solid transparent; border-radius: 8px;
    background: #3a4042;
  }
  .nb-item.active { border-left: none; border-bottom-color: #74b9ff; background: #0984e3; }
  .nb-item .nb-id { font-size: 10px; }
  .nb-item .nb-title { font-size: 12px; margin-top: 1px; }
  .main { flex: 1 1 auto; overflow: visible; padding: 14px 12px 48px; }
  .nb-header h1 { font-size: 19px; }
  .nb-header p { font-size: 13px; line-height: 1.5; }
  .toolbar { gap: 8px; margin: 12px 0; }
  .toolbar button { padding: 9px 14px; font-size: 13px; border-radius: 8px; }
  .score-box { font-size: 15px; margin-left: 4px; }
  .cell { border-radius: 10px; margin-bottom: 12px; }
  .cell-label { font-size: 11px; padding: 5px 12px; }
  pre.code {
    font-size: 12.5px; line-height: 1.65; padding: 12px 10px;
    white-space: pre-wrap; word-break: break-word; overflow-x: auto;
  }
  .blank { min-width: 84px; padding: 3px 6px; font-size: 12.5px; }
  .cell-result { font-size: 12px; padding: 8px 12px; }
  .ans-hint { display: block; margin-left: 0; margin-top: 2px; }
}
@media (max-width: 420px){
  pre.code { font-size: 11.5px; }
  .blank { min-width: 70px; }
  .toolbar button { padding: 8px 11px; font-size: 12.5px; }
}
</style>
</head>

 = data_month._____(by='日期')\n\nplt.figure(figsize=(12, 6))\nplt.plot(_____, _____, marker='o', linestyle='-', linewidth=2)\nplt.scatter(_____, _____)\nplt.xlabel('日期')\nplt.ylabel('压力差')\nplt.title(f'{max_pressure_diff_month}月份每天的压力差')\nplt.grid(True)\nplt._____", "answers": ["idxmax()", "max_pressure_diff_month", "sort_values", "data_month['日期']", "data_month['压力差']", "data_month['日期']", "data_month['压力差']", "show()"]}]}, {"id": "3.1.3", "title": "上海餐饮数据分析", "desc": "分析上海各行政区餐饮评分，找出综合评分最高区域的人均消费类别", "cells": [{"code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\n# 1. 加载数据集并输出\"行政区\"为\"浦东新区\"的数据头部信息\ndata = pd._____(\"上海餐饮数据.csv\")\npudong_data = data[data['行政区'] == '浦东新区']\nprint(pudong_data._____)", "answers": ["read_csv", "head()"]}, {"code": "# 2. 计算每个行政区的平均口味环境服务评分，并按综合评分从高到低排序\ndata = data[_____]  # 不包含未知行政区\ndata['综合评分'] = data[_____]._____(axis=1)\navg_scores_by_district = data._____.sort_values(by='综合评分', ascending=_____)\nprint(avg_scores_by_district)", "answers": ["data['行政区'] != '未知'", "['口味','环境','服务']", "mean", "groupby('行政区')[['口味','环境','服务','综合评分']].mean()", "False"]}, {"code": "# 3. 选择综合评分最高的行政区，以人均消费最高的前15个类别并以条形图展示\nhighest_score_district = avg_scores_by_district._____\nhighest_score_district_data = data[data['行政区'] == _____]\navg_consumption_by_category = highest_score_district_data._____.sort_values(ascending=False)\ntop_15_categories = avg_consumption_by_category._____\n\nplt.figure(figsize=(12, 6))\ntop_15_categories.plot(kind='bar')\nplt.xlabel('类别')\nplt.ylabel('人均消费平均值')\nplt.title(f'{highest_score_district}人均消费最高的前15个类别')\nplt.xticks(rotation=45)\nplt.show()", "answers": ["idxmax()", "highest_score_district", "groupby('类别')['人均消费'].mean()", "head(15)"]}]}, {"id": "3.1.4", "title": "房屋挂牌数据分析", "desc": "分析上海各地区房屋单价，找出均价最高区域的装修风格价格分布", "cells": [{"code": "import pandas as pd\nimport matplotlib.pyplot as plt\n\n# 1. 加载数据集并输出地区为黄埔的数据头部信息\ndata = pd._____(\"各地区房屋挂牌数据.csv\")\nhuangpu_data = data[_____]\nprint(huangpu_data._____)", "a let curNB = 0;

function renderList() {
  const el = document.getElementById('nbList');
  el.innerHTML = NBS.map(function(nb,i){
    return '<div class="nb-item ' + (i===curNB?'active':'') + '" onclick="selectNB(' + i + ')">' +
      '<div class="nb-id">' + nb.id + '</div>' +
      '<div class="nb-title">' + nb.title + '</div></div>';
  }).join('');
}

function selectNB(i) {
  curNB = i;
  renderList();
  renderNB();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderNB() {
  const nb = NBS[curNB];
  document.getElementById('nbTitle').textContent = nb.id + ' ' + nb.title;
  document.getElementById('nbDesc').textContent = nb.desc;
  document.getElementById('scoreBox').textContent = '';
  const area = document.getElementById('cellsArea');
  area.innerHTML = '';
  nb.cells.forEach(function(cell, ci){
    const parts = cell.code.split('_____');
    let inner = '';
    parts.forEach(function(part, pi){
      inner += escapeHtml(part);
      if (pi < parts.length - 1) {
        inner += '<input class="blank" id="b-' + ci + '-' + pi + '" autocomplete="off" spellcheck="false">';
        inner += '<span class="ans-hint" id="hint-' + ci + '-' + pi + '"></span>';
      }
    });
    area.innerHTML += '<div class="cell"><div class="cell-label">In [' + (ci+1) + ']</div><pre class="code">' + inner + '</pre><div class="cell-result" id="cellres-' + ci + '"></div></div>';
  });
}

function normalize(s) {
  return s.replace(/\s+/g,'').replace(/['\u2018\u2019]/g,"'").replace(/["\u201c\u201d]/g,'"').toLowerCase();
}

function checkAll() {
  const nb = NBS[curNB];
  let total = 0, correct = 0;
  nb.cells.forEach(function(cell, ci){
    let cellCorrect = 0;
    cell.answers.forEach(function(ans, pi){
      total++;
      const el = document.getElementById('b-' + ci + '-' + pi);
      const hint = document.getElementById('hint-' + ci + '-' + pi);
      const uv = normalize(el.value.trim());
      const av = normalize(ans.trim());
      el.classList.remove('correct','wrong','revealed');
      hint.classList.remove('show');
      if (uv === av) {
        el.classList.add('correct');
        cellCorrect++;
        correct++;
      } else {
        el.classList.add('wrong');
        hint.textContent = ' 正确: ' + ans;
        hint.classList.add('show');
      }
    });
    const res = document.getElementById('cellres-' + ci);
    res.classList.add('show');
    if (cellCorrect === cell.answers.length) {
      res.className = 'cell-result show pass';
      res.textContent = '单元格 ' + (ci+1) + ' 全部正确 (' + cellCorrect + '/' + cell.answers.length + ')';
    } else {
      res.className = 'cell-result show fail';
      res.textContent = '单元格 ' + (ci+1) + ' 正确 ' + cellCorrect + '/' + cell.answers.length;
    }
  });
  document.getElementById('scoreBox').textContent = '得分: ' + correct + '/' + total + ' (' + Math.round(correct/total*100) + '分)';
}

function revealAll() {
  const nb = NBS[curNB];
  nb.cells.forEach(function(cell, ci){
    cell.answers.forEach(function(ans, pi){
      const el = document.getElementById('b-' + ci + '-' + pi);
      el.value = ans;
      el.classList.remove('correct','wrong');
      el.classList.add('revealed');
      const hint = document.getElementById('hint-' + ci + '-' + pi);
      hint.classList.remove('show');
    });
  });
}

function resetAll() {
  const nb = NBS[curNB];
  nb.cells.forEach(function(cell, ci){
    cell.answers.forEach(function(ans, pi){
      const el = document.getElementById('b-' + ci + '-' + pi);
      el.value = '';
      el.classList.remove('correct','wrong','revealed');
      const hint = document.getElementById('hint-' + ci + '-' + pi);
      hint.classList.remove('show');
    });
    const res = document.getElementById('cellres-' + ci);
    res.classList.remove('show');
  });
  document.getElementById('scoreBox').textContent = '';
}

selectNB(0);
</script>
